<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Marcenaria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">

    <header id="topbar">
      <div id="topbar-left">
        <svg id="logo" width="20" height="20" viewBox="0 0 20 20" fill="none">
          <rect x="1" y="4" width="12" height="9" rx="1" stroke="currentColor" stroke-width="1.5"/>
          <rect x="7" y="8" width="12" height="8" rx="1" stroke="currentColor" stroke-width="1.5"/>
        </svg>
        <span id="project-name">Sem título</span>
      </div>
      <div id="toolbar-wrap">
        <button id="btn-toolbar-menu" type="button" aria-label="Menu" aria-expanded="false" aria-controls="toolbar">
          <svg class="toolbar-menu-icon" width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
            <path class="toolbar-menu-bar toolbar-menu-bar--top" d="M2 5h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path class="toolbar-menu-bar toolbar-menu-bar--mid" d="M2 9h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path class="toolbar-menu-bar toolbar-menu-bar--bot" d="M2 13h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
        <div id="toolbar"></div>
      </div>
      <button id="btn-add-panel">+ Painel</button>
    </header>

    <div id="workspace">

      <aside id="sidebar-left">
        <div id="panel-tree"></div>
      </aside>

      <main id="viewport">
        <canvas id="canvas"></canvas>
        <button id="viewport-hint">Clique aqui para adicionar o primeiro painel</button>
        <button id="btn-mobile-move" type="button" aria-label="Mover peça selecionada"></button>
      </main>

      <aside id="sidebar-right">
        <div id="properties"></div>
      </aside>

    </div>

    <div id="bottom-strip">
      <div id="pieces-panel"></div>
      <div id="problems-panel"></div>
    </div>

    <!-- mobile nav -->
    <nav id="mobile-nav">
      <button class="mnav-btn active" data-pane="tree">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="1" width="14" height="3.5" rx=".75" stroke="currentColor" stroke-width="1.3"/><rect x="1" y="6.25" width="14" height="3.5" rx=".75" stroke="currentColor" stroke-width="1.3"/><rect x="1" y="11.5" width="9" height="3.5" rx=".75" stroke="currentColor" stroke-width="1.3"/></svg>
        Painéis
      </button>
      <button class="mnav-btn" data-pane="pieces">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="1" width="6" height="6" rx=".75" stroke="currentColor" stroke-width="1.3"/><rect x="9" y="1" width="6" height="6" rx=".75" stroke="currentColor" stroke-width="1.3"/><rect x="1" y="9" width="6" height="6" rx=".75" stroke="currentColor" stroke-width="1.3"/><rect x="9" y="9" width="3.5" height="3.5" rx=".75" stroke="currentColor" stroke-width="1.3"/></svg>
        Peças
      </button>
      <button class="mnav-btn" data-pane="problems">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 1.5L15 14H1L8 1.5Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M8 6.5v3M8 11.5v.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        Alertas
      </button>
    </nav>

    <div id="mobile-sheet">
      <div id="m-pane-tree"     class="mpane active"><div id="m-panel-tree"></div></div>
      <div id="m-pane-pieces"   class="mpane hidden"><div id="m-pieces-panel"></div></div>
      <div id="m-pane-problems" class="mpane hidden"><div id="m-problems-panel"></div></div>
    </div>

    <button id="fab">+</button>

    <div id="toolbar-menu-overlay"></div>

    <div id="onboarding-overlay" aria-hidden="true">
      <div id="onboarding-dialog" role="dialog" aria-labelledby="onboarding-title" aria-modal="true">
        <h2 id="onboarding-title">Como usar</h2>
        <p class="onboarding-lead">Desenhe painéis, marque fitas e exporte o pedido de corte.</p>
        <ul id="onboarding-tips" class="onboarding-tips"></ul>
        <button id="btn-onboarding-close" type="button">Começar</button>
      </div>
    </div>

    <div id="m-props-overlay"></div>
    <div id="m-props-sheet">
      <div id="m-props-drag"></div>
      <div id="m-props-head">
        <span>Propriedades</span>
        <button id="btn-close-props">✕</button>
      </div>
      <div id="m-properties"></div>
    </div>

  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
