# Deploy (tag = commit curto; rollback: IMAGE_TAG=<sha-antigo> docker compose ... up -d):
#   ./scripts/deploy.sh
#   IMAGE_TAG=$(git rev-parse --short HEAD) docker compose -p marcenaria up -d --build
#
# Domínio:
#   marcenaria.morla.com.br  → app (Vite static)

networks:
  traefik:
    external: true

services:
  web:
    build: .
    image: ${REGISTRY:-ghcr.io/arthurlehdermann}/app-marcenaria:${IMAGE_TAG:?defina IMAGE_TAG com o SHA do commit}
    container_name: app_marcenaria_web
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app-marcenaria-web.rule=Host(`marcenaria.staging.bigworks.com.br`)"
      - "traefik.http.routers.app-marcenaria-web.entrypoints=websecure"
      - "traefik.http.routers.app-marcenaria-web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.app-marcenaria-web.middlewares=marcenaria-headers,compress-all@file"
      - "traefik.http.middlewares.marcenaria-headers.headers.customResponseHeaders.X-Content-Type-Options=nosniff"
      - "traefik.http.middlewares.marcenaria-headers.headers.customResponseHeaders.X-Frame-Options=SAMEORIGIN"
      - "traefik.http.middlewares.marcenaria-headers.headers.customResponseHeaders.Referrer-Policy=strict-origin-when-cross-origin"
      - "traefik.http.services.app-marcenaria-web.loadbalancer.server.port=8080"
      - "traefik.docker.network=traefik"
